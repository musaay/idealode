name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # #129: DB testleri gerçekten koşsun diye Postgres service container.
    # Health check hazır olmadan sonraki adım başlamaz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idealode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/idealode_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/idealode_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          cd backend
          test -z "$(gofmt -l .)"

      - name: migrate (service container şeması)
        run: |
          cd backend
          go run ./cmd/idealode migrate

      - name: build, vet, test
        run: |
          cd backend
          go build ./...
          go vet ./...
          # -p 1: store/pipeline paketleri aynı test DB'sini paylaşıyor,
          # paket paralelliği deadlock'a yol açıyor (yerelde gözlendi).
          go test -p 1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          working-directory: backend

  ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
          # ui'nin dış bağımlılığı yok (yalnız stdlib) — go.sum yok, bu
          # yüzden go.sum'a bağlı modül önbelleği burada devre dışı.
          cache: false

      - name: gofmt
        run: |
          cd ui
          test -z "$(gofmt -l .)"

      - name: build, vet, test
        run: |
          cd ui
          go build ./...
          go vet ./...
          go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          working-directory: ui
