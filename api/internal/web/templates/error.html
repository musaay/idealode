{{ define "content" }}
<section class="error-page" aria-labelledby="error-title">
  <p class="error-status" aria-hidden="true">{{ .Status }}</p>
  <h1 id="error-title">{{ .Heading }}</h1>
  <p class="error-body">{{ .Message }}</p>
  <a class="btn" href="/">{{ .T "error.back_home" }}</a>
</section>
{{ end }}
